<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemarket Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
   
</head>
<body>

    <div class="login-card">
        <div class="brand-logo">
           <img src="./img/login_login.png" alt="img">
        </div>

        <h2>Sign In to Your Chemarket Account</h2>
        <p class="subtitle">Use your credentials to securely access the platform.</p>

        <form id="login-form" action="{block name='login_form_actionurl'}{$action}{/block}" method="post">
            <div class="form-group">
                <label class="form-label">Email Address *</label>
                <input type="email" id="email" class="form-control" placeholder="Enter your email address">
                <span class="error-message" id="emailError">Email is required</span>
            </div>
            
            <div class="form-group">
                <label class="form-label">Password *</label>
                <div class="password-field-container">
                    <input type="password" id="password" class="form-control" placeholder="Enter your password">
                    <i class="fa-regular fa-eye toggle-password" id="togglePasswordIcon"></i>
                </div>
                <span class="error-message" id="passwordError">Password is required</span>
                <div class="forgot-password-wrapper">
                    <a  href="{$urls.pages.password}" rel="nofollow" class="forgot-link">Forgot password?</a>
                </div>
            </div>

            <button type="submit" class="btn-login">
                Login <span>&rsaquo;</span>
            </button>
        </form>

        <div class="register-footer">
            New to Chemarket? <a href="#" class="register-link">Register a new account</a>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js">
      
    </script>
</body>
</html>
