<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemarket Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
    <style>
        :root {
            --primary-blue: #004d71;
            --text-dark: #333333;
            --text-muted: #666666;
            --border-color: #dee2e6;
        }

        body {
            font-family: 'Inter', sans-serif;
          
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 32px;
            width: 100%;
            max-width: 520px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        @media (max-width: 576px) {
            .login-card {
                border-radius: 20px;
                padding: 25px 20px;
            }
            h2 { font-size: 22px !important; }
        }

        .brand-logo {
            width: 70px;
            margin-bottom: 30px;
        }

        .logo-svg {
            fill: var(--primary-blue);
            height: 50px;
        }

        h2 {
            font-weight: 700;
            color: var(--text-dark);
            font-size: 24px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            font-weight: 600;
            font-size: 13px;
            color: var(--text-dark);
            margin-bottom: 8px;
            display: block;
        }

        .form-control {
            height: 50px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            padding-left: 15px;
            font-size: 14px;
            width: 100%;
        }

        /* --- Password Toggle CSS --- */
        .password-field-container {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-muted);
            z-index: 10;
            font-size: 16px;
        }

        #password {
            padding-right: 45px; /* Space for the icon */
        }

        .forgot-password-wrapper {
            display: flex;
            justify-content: flex-end;
            margin-top: 8px;
        }

        .forgot-link {
            text-decoration: underline;
            color: var(--text-muted);
            font-size: 13px;
        }

        .btn-login {
            background-color: var(--primary-blue);
            color: white;
            width: 100%;
            height: 55px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 16px;
            border: none;
            margin-top: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            background-color: #003a55;
            transform: translateY(-1px);
        }

        .register-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-dark);
        }

        .register-link {
            color: var(--primary-blue);
            text-decoration: underline;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-logo">
           <img src="./img/Vector.png" alt="img">
        </div>

        <h2>Sign In to Your Chemarket Account</h2>
        <p class="subtitle">Use your credentials to securely access the platform.</p>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label">Email Address *</label>
                <input type="email" id="email" class="form-control" placeholder="Enter your email address">
                <span class="error-message" id="emailError">Email is required</span>
            </div>
            
            <div class="form-group">
                <label class="form-label">Password *</label>
                <div class="password-field-container">
                    <input type="password" id="password" class="form-control" placeholder="Enter your password">
                    <i class="fa-regular fa-eye toggle-password" id="togglePasswordIcon"></i>
                </div>
                <span class="error-message" id="passwordError">Password is required</span>
                <div class="forgot-password-wrapper">
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>
            </div>

            <button type="submit" class="btn-login">
                Login <span>&rsaquo;</span>
            </button>
        </form>

        <div class="register-footer">
            New to Chemarket? <a href="#" class="register-link">Register a new account</a>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js">
      
    </script>
</body>
</html>
